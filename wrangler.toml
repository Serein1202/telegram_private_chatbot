name = "telegram_private_chatbot"
main = "worker.js"
compatibility_date = "2024-11-30"

# 注意：KV 命名空间 ID 每个用户都不一样，
# 所以不能写死在这里。用户需要在 Cloudflare 后台手动绑定。

# ---- v5.4 可选配置 ----

# 智能内容过滤：推荐绑定 Workers AI（对灰区消息做语义仲裁，降低误判）
# [ai]
# binding = "AI"

# 建议在 Cloudflare 后台 Worker Settings -> Variables 中配置：
#   必需：BOT_TOKEN、SUPERGROUP_ID、KV 绑定 TOPIC_MAP
#   Turnstile 验证（可选）：TURNSTILE_SITEKEY、TURNSTILE_SECRET（设为 Secret）
#   自定义域名时：PUBLIC_BASE_URL（如 https://chat.example.com）
#   Webhook 加密（可选）：WEBHOOK_SECRET（配合 setWebhook 的 secret_token 参数）
